name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: Build and test (Maven)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile, test and package
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar

  docker-push:
    name: Build and push image (ACR)
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push image
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/tasks-app:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

  deploy:
    name: Deploy to AKS (Ansible)
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: >
          az aks get-credentials
          -g ${{ secrets.AKS_RESOURCE_GROUP }}
          -n ${{ secrets.AKS_CLUSTER }}
          --overwrite-existing

      - name: Install Ansible and Kubernetes collection
        run: |
          pip install ansible kubernetes
          ansible-galaxy collection install kubernetes.core

      - name: Run Ansible playbook
        env:
          IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/tasks-app:${{ github.sha }}
        run: ansible-playbook ansible/deploy.yml

      - name: Show service address
        run: kubectl get service tasks-app