- name: Deploy tasks-app to AKS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    image: "{{ lookup('env', 'IMAGE') }}"
  tasks:
    - name: Apply deployment
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', '../k8s/deployment.yaml.j2') | from_yaml }}"
        wait: true
        wait_timeout: 300

    - name: Apply service
      kubernetes.core.k8s:
        state: present
        src: ../k8s/service.yaml